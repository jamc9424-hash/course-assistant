<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Course Assistant hybrid RAG architecture</title>
  <desc id="desc">Canvas files are parsed into text chunks and page or slide images. Separate keyword, text embedding, and visual embedding indexes feed candidate merging and multimodal reranking. The answer and quiz layer validates source evidence before the Gradio interface displays answers and images.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#94a3b8"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1440" height="860" fill="#020617"/>
  <rect width="1440" height="860" fill="url(#grid)" opacity=".55"/>
  <text x="70" y="66" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Course Assistant · Hybrid Multimodal RAG</text>
  <text x="70" y="96" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">JamesBranch architecture · Python + Gradio · class services remain server-side</text>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M230 245H330"/><path d="M230 285H330"/><path d="M230 325H330"/>
    <path d="M500 285H580"/><path d="M500 285H580"/>
    <path d="M740 205V170H820"/><path d="M740 285H820"/><path d="M740 365V400H820"/>
    <path d="M1000 170H1080V285"/><path d="M1000 285H1080"/><path d="M1000 400H1080V285"/>
    <path d="M1230 285H1320"/><path d="M1230 470H1320"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="175" width="160" height="190" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text x="95" y="210" fill="#fbbf24" font-size="17" font-family="Arial" font-weight="700">Canvas files</text>
    <text x="95" y="245" fill="#cbd5e1" font-size="14" font-family="Arial">PDF</text><text x="95" y="275" fill="#cbd5e1" font-size="14" font-family="Arial">PPTX / DOCX</text><text x="95" y="305" fill="#cbd5e1" font-size="14" font-family="Arial">TXT / Markdown</text><text x="95" y="340" fill="#64748b" font-size="12" font-family="Arial">upload · deduplicate</text>

    <rect x="330" y="175" width="170" height="190" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="355" y="210" fill="#34d399" font-size="17" font-family="Arial" font-weight="700">Preparation</text>
    <text x="355" y="248" fill="#cbd5e1" font-size="14" font-family="Arial">parse text</text><text x="355" y="278" fill="#cbd5e1" font-size="14" font-family="Arial">chunk + metadata</text><text x="355" y="308" fill="#cbd5e1" font-size="14" font-family="Arial">render PDF pages</text><text x="355" y="338" fill="#cbd5e1" font-size="14" font-family="Arial">retain evidence</text>

    <rect x="580" y="115" width="160" height="340" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <text x="605" y="150" fill="#22d3ee" font-size="17" font-family="Arial" font-weight="700">Separate indexes</text>
    <rect x="605" y="180" width="110" height="58" rx="6" fill="#083344" stroke="#22d3ee"/><text x="620" y="214" fill="#cffafe" font-size="13" font-family="Arial">BM25 keywords</text>
    <rect x="605" y="256" width="110" height="58" rx="6" fill="#083344" stroke="#22d3ee"/><text x="620" y="290" fill="#cffafe" font-size="13" font-family="Arial">text vectors</text>
    <rect x="605" y="332" width="110" height="58" rx="6" fill="#083344" stroke="#22d3ee"/><text x="620" y="366" fill="#cffafe" font-size="13" font-family="Arial">visual vectors</text>
    <text x="605" y="425" fill="#64748b" font-size="12" font-family="Arial">text + image records</text>

    <rect x="820" y="115" width="180" height="340" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <text x="845" y="150" fill="#a78bfa" font-size="17" font-family="Arial" font-weight="700">Class services</text>
    <text x="845" y="190" fill="#cbd5e1" font-size="13" font-family="Arial">9002 · text embed</text><text x="845" y="225" fill="#cbd5e1" font-size="13" font-family="Arial">9003 · visual embed</text><text x="845" y="260" fill="#cbd5e1" font-size="13" font-family="Arial">9004 · reranker</text><text x="845" y="295" fill="#cbd5e1" font-size="13" font-family="Arial">9005 · parser</text><text x="845" y="350" fill="#fda4af" font-size="12" font-family="Arial">API key: server-side only</text><text x="845" y="380" fill="#64748b" font-size="12" font-family="Arial">HTTP opt-in for class network</text>

    <rect x="1080" y="205" width="150" height="160" rx="10" fill="#0f172a" stroke="#f97316" stroke-width="2"/>
    <text x="1105" y="240" fill="#fb923c" font-size="17" font-family="Arial" font-weight="700">RAG merge</text>
    <text x="1105" y="278" fill="#cbd5e1" font-size="14" font-family="Arial">candidate union</text><text x="1105" y="308" fill="#cbd5e1" font-size="14" font-family="Arial">rerank</text><text x="1105" y="338" fill="#cbd5e1" font-size="14" font-family="Arial">best evidence</text>

    <rect x="1320" y="205" width="90" height="160" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="1338" y="240" fill="#34d399" font-size="16" font-family="Arial" font-weight="700">Answer</text><text x="1338" y="275" fill="#cbd5e1" font-size="13" font-family="Arial">answer</text><text x="1338" y="300" fill="#cbd5e1" font-size="13" font-family="Arial">sources</text><text x="1338" y="325" fill="#cbd5e1" font-size="13" font-family="Arial">images</text>

    <rect x="1080" y="430" width="330" height="110" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="1105" y="465" fill="#34d399" font-size="17" font-family="Arial" font-weight="700">Quiz + validation</text><text x="1105" y="495" fill="#cbd5e1" font-size="13" font-family="Arial">fixed key · hidden solutions · score</text><text x="1105" y="520" fill="#cbd5e1" font-size="13" font-family="Arial">source-supported explanations</text>
  </g>

  <rect x="70" y="620" width="1340" height="120" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="100" y="660" fill="#f8fafc" font-size="18" font-family="Arial" font-weight="700">Gradio interface</text>
  <text x="100" y="692" fill="#cbd5e1" font-size="14" font-family="Arial">Upload/remove materials · ask text or visual questions · view document/page/slide evidence · generate and score quizzes</text>
  <text x="100" y="720" fill="#94a3b8" font-size="13" font-family="Arial">Local keyword fallback remains available when class services are unavailable.</text>
</svg>
